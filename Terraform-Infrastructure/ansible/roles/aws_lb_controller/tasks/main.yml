---
# tasks file for aws_lb_controller
- name: Validate AWS Load Balancer Controller configuration
  ansible.builtin.assert:
    that:
      - vpc_id | length > 0
      - eks_cluster_name | length > 0
      - aws_region | length > 0
    fail_msg: Set vpc_id, eks_cluster_name, and aws_region before installing the AWS Load Balancer Controller.

- name: Add eks-charts Helm repo
  kubernetes.core.helm_repository:
    name: eks
    repo_url: https://aws.github.io/eks-charts
    binary_path: "{{ helm_binary_path }}"

- name: Install/upgrade AWS Load Balancer Controller
  kubernetes.core.helm:
    name: aws-load-balancer-controller
    chart_ref: eks/aws-load-balancer-controller
    chart_version: "{{ lb_controller_chart_version }}"
    release_namespace: "{{ lb_controller_namespace }}"
    kubeconfig: "{{ kubeconfig_path }}"
    binary_path: "{{ helm_binary_path }}"
    values:
      clusterName: "{{ eks_cluster_name }}"
      region: "{{ aws_region }}"
      vpcId: "{{ vpc_id }}"
      serviceAccount:
        create: true
        name: aws-load-balancer-controller
    wait: true

- name: Check AWS Load Balancer Controller Pod Identity association
  ansible.builtin.command:
    argv:
      - aws
      - eks
      - list-pod-identity-associations
      - --cluster-name
      - "{{ eks_cluster_name }}"
      - --namespace
      - "{{ lb_controller_namespace }}"
      - --service-account
      - aws-load-balancer-controller
      - --region
      - "{{ aws_region }}"
      - --query
      - "associations[0].associationId"
      - --output
      - text
  register: lb_controller_pod_identity_association
  changed_when: false

- name: Create AWS Load Balancer Controller Pod Identity association
  ansible.builtin.command:
    argv:
      - aws
      - eks
      - create-pod-identity-association
      - --cluster-name
      - "{{ eks_cluster_name }}"
      - --namespace
      - "{{ lb_controller_namespace }}"
      - --service-account
      - aws-load-balancer-controller
      - --role-arn
      - "{{ lb_controller_role_arn }}"
      - --region
      - "{{ aws_region }}"
  when: lb_controller_pod_identity_association.stdout | trim in ['', 'None']
  register: lb_controller_pod_identity_create
  changed_when: true
